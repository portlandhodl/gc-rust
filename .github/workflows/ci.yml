# Build every example + run the host/unit tests on Linux, macOS and Windows.
# Dolphin isn't installed on the runners, so `make check` skips the smoke
# boots (exit 77) and runs gc-dol/gc-bnr/gc-host-tests + DOL validation.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        # Windows builds from an MSYS2 shell (make + POSIX tools), with the
        # runner's rustup/MSVC toolchain inherited on PATH.
        shell: ${{ matrix.os == 'windows-latest' && 'msys2 {0}' || 'bash' }}
    steps:
      - uses: actions/checkout@v4

      - if: matrix.os == 'windows-latest'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          update: false
          install: make
          path-type: inherit

      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            tools/gc-dol -> target-host
            tools/gc-bnr -> target-host
            tools/gc-host-tests -> target-host
            tools/gc-iso -> target
            crates/apploader -> target

      - name: make check (all examples + unit/host tests)
        run: make check

      - name: make sd EXAMPLE=yarn-cat
        run: make sd EXAMPLE=yarn-cat

      - name: make iso EXAMPLE=dvd-read
        run: make iso EXAMPLE=dvd-read

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: |
            dist/*.dol
            dist/*.iso
            dist/sd/
          if-no-files-found: error
