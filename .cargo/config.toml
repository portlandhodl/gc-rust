# Build configuration for Nintendo GameCube (Gekko / PowerPC 750CXe).
#
# `core` and `alloc` are built from source with `-Z build-std` because this
# custom target ships no prebuilt std. Linking is done by rust-lld
# (`linker = "rust-lld"` in the target spec) with our `memory.x.ld` layout
# script. No external toolchain is needed.

[build]
target = "powerpc-gekko-none-eabi.json"

[unstable]
build-std = ["core", "alloc"]
json-target-spec = true
