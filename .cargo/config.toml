# Build configuration for Nintendo GameCube (Gekko / PowerPC 750CXe).
#
# - The default *target* is the GameCube spec; host tools (tools/gc-dol)
#   override this with their own `.cargo/config.toml`.
# - `core`/`alloc` are rebuilt from source via `-Zbuild-std`, passed by the
#   Makefile through RUSTFLAGS so it only applies to GameCube targets.
[build]
target = "powerpc-gekko-none-eabi.json"

[unstable]
json-target-spec = true
